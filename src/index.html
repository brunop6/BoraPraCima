<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bora Pra Cima</title>
    <base href="/" />

    <!-- viewport-fit=cover libera as áreas seguras do iPhone; sem maximum-scale,
         para não bloquear o zoom de quem precisa aumentar o texto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Genérica de propósito: a prévia do link no WhatsApp não deve revelar
         nome de paciente nem leito. -->
    <meta name="description" content="Organize a escala de acompanhantes de quem está internado." />
    <meta property="og:title" content="Bora Pra Cima" />
    <meta property="og:description" content="Escala de acompanhantes, compartilhada por link." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- A cor da barra do navegador acompanha o tema, que muda com a hora (ThemeService). -->
    <meta name="theme-color" content="#1f4d3f" />

    <!-- Instalável na tela inicial: no corredor do hospital, o atalho é mais fácil de
         achar que o link no meio da conversa do WhatsApp. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bora Pra Cima" />
    <link rel="apple-touch-icon" sizes="180x180" href="marca/icone-apple-180.png" />

    <!-- Tela de abertura do iOS: o Safari não monta uma a partir do manifesto, e sem estas
         imagens abre em branco. Uma por tamanho de iPhone em pé, sempre no fundo escuro
         (mesma escolha do `background_color` do manifesto). No Android a abertura sai do
         manifesto: `background_color` mais o ícone de 512px. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="marca/abertura/828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1080x2340.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="marca/abertura/1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="marca/abertura/750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="marca/abertura/640x1136.png" />

    <!-- Nunito para a interface, Satisfy só para o nome do produto. `display=swap`
         para o texto aparecer na fonte do sistema enquanto a da marca não chega:
         no corredor do hospital, texto invisível é pior que texto na fonte errada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&family=Satisfy&display=swap"
    />

    <!-- O emblema da marca. A versão de 144px basta para a aba e é leve; o
         `favicon.ico` genérico continua em public/, mas nada mais aponta para ele. -->
    <link rel="icon" type="image/png" sizes="144x144" href="marca/emblema-144.png" />

    <!--
      O tema é decidido pela hora do aparelho: claro das 06:00 às 18:00, escuro no
      resto. Roda aqui, antes do primeiro desenho, para a página não abrir branca de
      madrugada; o ThemeService assume depois e faz as trocas. As horas e as cores
      são as de core/theme/theme.util.ts: mexeu lá, mexa aqui.
    -->
    <script>
      (function () {
        var hour = new Date().getHours();
        var dark = hour < 6 || hour >= 18;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#142c2b' : '#1f4d3f');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
