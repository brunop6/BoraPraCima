<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Bora Pra Cima</title>
    <base href="/" />

    <!-- viewport-fit=cover libera as áreas seguras do iPhone; sem maximum-scale,
         para não bloquear o zoom de quem precisa aumentar o texto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Genérica de propósito: a prévia do link no WhatsApp não deve revelar
         nome de paciente nem leito. -->
    <meta name="description" content="Organize a escala de acompanhantes de quem está internado." />
    <meta property="og:title" content="Bora Pra Cima" />
    <meta property="og:description" content="Escala de acompanhantes, compartilhada por link." />
    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#0f7b6c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f171c" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="favicon.ico" sizes="any" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
